<!DOCTYPE html>
<html>
<head>
    <title>NGL API</title>
</head>
<body style="background-color: #000; color: #333; font-family: monospace;">

    <div id="status">Memproses...</div>

    <script>
        async function startApp() {
            // 1. Ambil data dari URL Parameter
            const params = new URLSearchParams(window.location.search);
            const user = params.get('user');
            const msg = params.get('msg');
            const qty = parseInt(params.get('qty')) || 1;
            const delay = parseInt(params.get('delay')) || 0;
            const display = document.getElementById('status');

            // 2. Validasi: Jika tidak ada parameter, munculkan instruksi singkat
            if (!user || !msg) {
                display.innerText = "Format: ?user=...&msg=...&qty=...&delay=...";
                display.style.color = "white";
                return;
            }

            // 3. Proses Pengiriman (Looping)
            for (let i = 1; i <= qty; i++) {
                try {
                    // Kirim ke API NGL (Gunakan mode no-cors agar tidak terblokir browser)
                    await fetch('https://ngl.link/api/submit', {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            'username': user,
                            'question': msg,
                            'deviceId': 'api-' + Math.random().toString(36).substring(2, 12)
                        })
                    });
                    
                    console.log(`Pesan ${i} terkirim`);
                } catch (e) {
                    console.error("Gagal mengirim");
                }

                // Jeda jika ada delay
                if (delay > 0 && i < qty) {
                    await new Promise(r => setTimeout(r, delay));
                }
            }

            // 4. Setelah selesai, layar tetap bersih/hanya teks OK
            display.innerText = "OK"; 
            display.style.color = "#111"; // Teks hampir tidak terlihat (kamuflase)
        }

        // Jalankan otomatis saat halaman dibuka
        startApp();
    </script>
</body>
</html>
