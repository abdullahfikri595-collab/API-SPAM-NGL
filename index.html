<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGL Sender Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-pink-500">NGL Auto Sender</h2>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="Username NGL" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-pink-500">
            <textarea id="message" placeholder="Pesan Anda" class="w-full p-2 rounded bg-gray-700 border border-gray-600 h-24 focus:outline-none focus:border-pink-500"></textarea>
            <div class="flex gap-2">
                <input type="number" id="amount" placeholder="Jumlah" class="w-1/2 p-2 rounded bg-gray-700 border border-gray-600">
                <input type="number" id="delay" placeholder="Delay (ms)" value="1000" class="w-1/2 p-2 rounded bg-gray-700 border border-gray-600">
            </div>
            <button onclick="sendMessages()" id="btn" class="w-full bg-pink-600 hover:bg-pink-700 p-2 rounded font-bold transition">Kirim Sekarang</button>
        </div>
        <p id="status" class="mt-4 text-sm text-center text-gray-400"></p>
    </div>

    <script>
        async function sendMessages() {
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            const data = {
                username: document.getElementById('username').value,
                message: document.getElementById('message').value,
                amount: document.getElementById('amount').value,
                delay: document.getElementById('delay').value
            };

            btn.disabled = true;
            btn.innerText = "Proses Mengirim...";
            status.innerText = "Sedang bekerja, jangan tutup tab ini...";

            try {
                const res = await fetch('/.netlify/functions/send', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                status.innerText = result.status || result.error;
            } catch (e) {
                status.innerText = "Terjadi kesalahan koneksi.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Kirim Sekarang";
            }
        }
    </script>
</body>
</html>
