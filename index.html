<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fast Responder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .cursor { display: inline-block; width: 8px; height: 1.2em; background: #3b82f6; margin-left: 4px; animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-2xl">
        <div id="status" class="text-blue-400 text-sm font-bold mb-2 tracking-widest uppercase opacity-0 transition-opacity duration-300">
            Menghubungkan...
        </div>
        
        <div id="response-box" class="text-2xl md:text-4xl font-bold leading-tight">
            <span id="output-text">Gunakan URL untuk bertanya...</span><span id="cursor" class="cursor hidden"></span>
        </div>

        <div id="error-log" class="mt-8 text-red-400 text-sm font-mono hidden"></div>
    </div>

    <script>
        const API_KEY = "AIzaSyCUyk7q17Z30FRpIFhFVzF61kruO0Au_-w";
        // Menggunakan endpoint stream untuk kecepatan maksimal
        const STREAM_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:streamGenerateContent?alt=sse&key=" + API_KEY;

        async function startStreaming(prompt) {
            const output = document.getElementById('output-text');
            const cursor = document.getElementById('cursor');
            const status = document.getElementById('status');
            
            output.innerText = "";
            cursor.classList.remove('hidden');
            status.style.opacity = "1";
            status.innerText = "Memproses...";

            try {
                const response = await fetch(STREAM_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Jawab dengan singkat dan padat. Jika ditanya siapa kamu, jawab "Saya Gemini, AI ciptaan Google." Pertanyaan: ${prompt}` }]
                        }]
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const json = JSON.parse(line.substring(6));
                                const textChunk = json.candidates[0].content.parts[0].text;
                                if (textChunk) {
                                    fullText += textChunk;
                                    output.innerText = fullText;
                                    status.style.opacity = "0"; // Sembunyikan status saat teks mulai muncul
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (err) {
                document.getElementById('error-log').classList.remove('hidden');
                document.getElementById('error-log').innerText = "Gagal: " + err.message;
            } finally {
                cursor.classList.add('hidden');
            }
        }

        function init() {
            const params = new URLSearchParams(window.location.search);
            let query = params.get('q');

            // Cek manual untuk format ?=prompt
            if (!query) {
                const search = window.location.search;
                if (search.includes('=')) {
                    query = decodeURIComponent(search.split('=')[1]);
                } else if (search.length > 1) {
                    query = decodeURIComponent(search.substring(1));
                }
            }

            if (query) {
                startStreaming(query);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
