
<!DOCTYPE html>
<html>
<body style="background:#000;color:#0f0;">
    <script>
        (async () => {
            const p = new URLSearchParams(window.location.search);
            const user = p.get('user'); // Ambil username (contoh: niomods)
            const msg = p.get('msg');
            const qty = p.get('qty') || 1;

            if (user && msg) {
                for (let i = 0; i < qty; i++) {
                    // Ini yang lo mau: langsung ke ngl.link/username
                    await fetch(`https://ngl.link/${user}`, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: `question=${msg}&deviceId=hp${Math.random()}`
                    });
                }
                document.body.innerText = "GAS TERKIRIM KE NGL.LINK/" + user.toUpperCase();
            }
        })();
    </script>
</body>
</html>
